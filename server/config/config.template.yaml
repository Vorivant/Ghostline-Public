# Headscale 0.29.7 configuration for a Ghostline server, written by configure.sh from this template
# (@DOMAIN@ is replaced). Based on Headscale's config-example.yaml (BSD-3-Clause, see LICENSE-headscale-BSD-3.txt).
server_url: https://@DOMAIN@
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
trusted_proxies:
  - 172.28.0.2/32

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Relays: the built-in relay of this server, reached on https://@DOMAIN@ (and STUN on UDP 3478). No third-party
# relay map is loaded, so your devices never use relays run by anyone else. It accepts only your own devices.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "ghostline"
    region_name: "Ghostline server"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true

node:
  expiry: 180d
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# TLS is done by Caddy.
tls_letsencrypt_hostname: ""
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  base_domain: ghostline.internal
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0600"

logtail:
  enabled: false
