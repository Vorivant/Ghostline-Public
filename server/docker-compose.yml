# Ghostline server: Headscale (coordination, open source, BSD-3-Clause) + Caddy (automatic HTTPS).
# Run ./configure.sh --domain <your domain> once, then: docker compose up -d   (see SELF-HOST.md)
# Images are pinned by digest; update them on purpose (SELF-HOST.md, "Updating").
name: ghostline-server

services:
  headscale:
    image: docker.io/headscale/headscale:0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    container_name: ghostline-headscale
    restart: unless-stopped
    command: serve
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /var/run/headscale:mode=0700,noexec,nosuid,nodev,size=16m
    volumes:
      - ./config:/etc/headscale:ro      # config.yaml, policy.hujson
      - ./data:/var/lib/headscale       # database and private keys: back this folder up, keep it private
    expose:
      - "8080"                          # reached only through Caddy
    ports:
      - "3478:3478/udp"                 # STUN for the built-in relay (helps devices find a direct path)
    mem_limit: 1g
    pids_limit: 512
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      edge:
        ipv4_address: 172.28.0.10

  caddy:
    image: docker.io/library/caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    container_name: ghostline-caddy
    restart: unless-stopped
    depends_on: [headscale]
    env_file: [.env]                    # GHOSTLINE_DOMAIN, written by configure.sh
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    ports:
      - "80:80"                         # certificate issuance and redirect to HTTPS
      - "443:443"                       # devices, sign-in pages and the relay
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 512m
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    networks:
      edge:
        ipv4_address: 172.28.0.2

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24         # Headscale trusts only Caddy's fixed address for client addresses

volumes:
  caddy_data:
  caddy_config:
