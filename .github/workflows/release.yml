# Build a release: desktop clients, Android app, licences, packages, signed SHA256SUMS and the download page.
# Run manually on a reviewed main commit ONLY; the result is an internal artifact, never auto-published.
# The signing jobs (android, package) run in the GitHub Environment "release". Create it under Settings >
# Environments with required reviewers and deployment branches and tags limited to main and v*, and store these
# secrets there (not as repository secrets), so nobody can sign a build from another branch or without approval.
# Optional environment secrets (each used only by the step that needs it):
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD   Android release key (android/README.md). Without them the
#                                                    release has no APK.
#   RELEASE_SIGNING_KEY                              SSH private key that signs SHA256SUMS (packaging/sign-release.sh).
#   RELEASE_SIGNING_PUB                              its public half, published on the download page.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unapproved release prerequisites
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = refs/heads/main || { echo "Only main may build production releases"; exit 1; }
          echo "::error::Production pipeline requires isolated Android signing, Authenticode-signed Windows binaries, reviewed Android dependency license inventory and device acceptance before release."
          exit 1

  desktop:
    needs: release-prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Go version from upstream.json
        run: echo "GO_VERSION=$(python3 -I -c 'import json; print(json.load(open("upstream.json"))["go"])')" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: GOTOOLCHAIN=local ./build.sh --target all --out dist/build --work .work
      - name: Go module licences
        run: |
          set -euo pipefail
          tags="$(sed -n 's/^TAGS=//p' build.sh)"
          for t in linux-amd64 linux-arm64 windows-amd64; do
            GOTOOLCHAIN=local python3 -I packaging/collect_go_licences.py --src .work/src --target "$t" --tags "$tags" --out "dist/licences/$t"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: desktop
          path: dist/
          retention-days: 3

  android:
    needs: release-prerequisites
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Go version from upstream.json
        run: echo "GO_VERSION=$(python3 -I -c 'import json; print(json.load(open("upstream.json"))["go"])')" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;23.1.7779620" > /dev/null
      - name: Build (unsigned; no secret is present while third-party build tools run)
        run: GOTOOLCHAIN=local android/build-app.sh --sdk "$ANDROID_HOME" --work "$RUNNER_TEMP/android" --out dist/android
      - name: Sign (only when the key secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="$(ls dist/android/*-android-unsigned.apk)"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Android signing keys are required for production"
            exit 1
          fi
          umask 077
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keydir/release.p12"
          printf '%s' "$KEYSTORE_PASSWORD" > "$keydir/release.pass"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          signed="${unsigned%-unsigned.apk}.apk"
          "$bt/apksigner" sign --ks "$keydir/release.p12" --ks-pass "file:$keydir/release.pass" --ks-key-alias ghostline \
            --out "$signed" "$unsigned"
          "$bt/apksigner" verify --print-certs "$signed" | grep -E 'SHA-256'
          rm -f "$unsigned"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: android
          path: dist/android/
          retention-days: 3

  package:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: desktop
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: android
          path: dist/android/
      - name: Package
        env:
          SIGNING_PUB: ${{ secrets.RELEASE_SIGNING_PUB }}
        run: |
          set -euo pipefail
          chmod +x dist/build/linux-*/ghostline dist/build/linux-*/ghostlined
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          args=()
          apk="$(ls dist/android/Ghostline-*-android.apk 2>/dev/null | head -n1 || true)"
          [ -n "$apk" ] && args+=(--apk "$apk")
          if [ -n "$SIGNING_PUB" ]; then printf '%s\n' "$SIGNING_PUB" > "$RUNNER_TEMP/signing.pub"; args+=(--signing-pub "$RUNNER_TEMP/signing.pub"); fi
          python3 -I packaging/package.py --build dist/build --licences dist/licences --out dist/release "${args[@]}"
      - name: Sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then echo "::error::RELEASE_SIGNING_KEY is required"; exit 1; fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          packaging/sign-release.sh --key "$RUNNER_TEMP/signing.key" --dir dist/release
          rm -f "$RUNNER_TEMP/signing.key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ghostline-release-${{ github.ref_name }}
          path: dist/release
          retention-days: 30
